<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>AI Event Planner | Нэвтрэх</title>

    <link rel="stylesheet" href="/static/output.css">

    <style>
        .tab.active {
            border-bottom-width: 2px;
            border-color: rgb(99 102 241); /* indigo-500 */
            font-weight: 600;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-slate-100 flex items-center justify-center">

<div class="w-full max-w-5xl mx-auto px-6">
    <div class="grid lg:grid-cols-2 gap-12 items-center">

        <!-- LEFT SIDE (INFO) -->
        <div class="space-y-6">
            <span class="inline-flex items-center px-4 py-1 rounded-full bg-indigo-500/20 text-indigo-300 text-sm font-medium">
                AI Event Planner
            </span>

            <h1 class="text-4xl font-bold leading-tight text-white">
                Ухаалгаар <span class="text-indigo-400">төлөвлө</span>,  
                <br>илүү хурдан шийд.
            </h1>

            <p class="text-slate-300 text-lg">
                Имэйл эсвэл утасны дугаараар нэвтэрч, бүх арга хэмжээгээ нэг дороос удирдаарай.
            </p>

            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-indigo-500/20 border border-indigo-400/30 flex items-center justify-center font-bold text-indigo-300">
                    AI
                </div>
                <div>
                    <p class="font-semibold text-white">Ухаалаг систем</p>
                    <p class="text-slate-400 text-sm">Нэвтрэлт, түүх, хэрэглэгчийн удирдлага</p>
                </div>
            </div>

            <div class="grid sm:grid-cols-2 gap-3">
                <button data-tab-jump="register" class="rounded-xl bg-indigo-500/20 border border-indigo-400/30 px-4 py-3 text-left hover:border-indigo-300 hover:-translate-y-0.5 transition">
                    <p class="text-white font-semibold">Шинэ хэрэглэгч</p>
                    <p class="text-slate-300 text-sm">Имэйл эсвэл утсаар бүртгүүлнэ</p>
                </button>
                <button data-tab-jump="provider" class="rounded-xl bg-emerald-500/15 border border-emerald-400/30 px-4 py-3 text-left hover:border-emerald-300 hover:-translate-y-0.5 transition">
                    <p class="text-white font-semibold">Үйлчилгээ үзүүлэгч</p>
                    <p class="text-slate-300 text-sm">Танхим, үйлчилгээ бүртгүүлэх</p>
                </button>
            </div>
        </div>

        <!-- RIGHT SIDE (AUTH CARD) -->
        <div class="bg-white/10 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl p-8">

            <!-- Tabs -->
            <div class="flex border-b border-white/10 mb-6">
                <button type="button" class="tab active flex-1 py-3 text-center text-white" data-tab="login">Нэвтрэх</button>
                <button type="button" class="tab flex-1 py-3 text-center text-slate-300" data-tab="register">Хэрэглэгч бүртгүүлэх</button>
                <button type="button" class="tab flex-1 py-3 text-center text-slate-300" data-tab="provider">Үйлчилгээ бүртгүүлэх</button>
            </div>

            <!-- LOGIN -->
            <div id="login" class="tab-content active space-y-4">
                <div id="login-message" class="hidden text-sm rounded-md px-4 py-2"></div>

                <div>
                    <label class="text-sm text-slate-300">Имэйл эсвэл утас</label>
                    <input id="login-identifier" type="text"
                        placeholder="example@mail.com эсвэл +976..."
                        class="mt-1 w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 outline-none transition">
                </div>

                <div>
                    <label class="text-sm text-slate-300">Нууц үг</label>
                    <input id="login-password" type="password"
                        placeholder="••••••••"
                        class="mt-1 w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 outline-none transition">
                </div>

                <button type="button" id="login-btn"
                    class="w-full mt-2 py-3 rounded-lg bg-indigo-500 hover:bg-indigo-600 font-semibold transition-transform hover:scale-[1.02] active:scale-[0.98]">
                    Нэвтрэх
                </button>
            </div>

            <!-- USER REGISTER -->
            <div id="register" class="tab-content space-y-4">
                <div id="register-message" class="hidden text-sm rounded-md px-4 py-2"></div>

                <div>
                    <label class="text-sm text-slate-300">Имэйл эсвэл утас</label>
                    <input id="register-identifier" type="text"
                        placeholder="example@mail.com эсвэл +976..."
                        class="mt-1 w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 outline-none transition">
                </div>

                <div>
                    <label class="text-sm text-slate-300">Нууц үг</label>
                    <input id="register-password" type="password"
                        placeholder="••••••••"
                        class="mt-1 w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 outline-none transition">
                </div>

                <button type="button" id="register-btn"
                    class="w-full mt-2 py-3 rounded-lg bg-emerald-500 hover:bg-emerald-600 font-semibold transition-transform hover:scale-[1.02] active:scale-[0.98]">
                    Бүртгүүлэх
                </button>
            </div>

            <!-- PROVIDER REGISTER -->
            <div id="provider" class="tab-content space-y-4">
                <div id="provider-message" class="hidden text-sm rounded-md px-4 py-2"></div>

                <div class="grid grid-cols-1 gap-3">
                    <div>
                        <label class="text-sm text-slate-300">Байгууллагын нэр</label>
                        <input id="p-name" type="text" placeholder="Royal Event Hall"
                            class="mt-1 w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 placeholder-slate-400 focus:ring-2 focus:ring-emerald-500 outline-none transition">
                    </div>
                    <div class="grid sm:grid-cols-2 gap-3">
                        <div>
                            <label class="text-sm text-slate-300">Хүчин чадал</label>
                            <input id="p-capacity" type="number" placeholder="200"
                                class="mt-1 w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 placeholder-slate-400 focus:ring-2 focus:ring-emerald-500 outline-none transition">
                        </div>
                        <div>
                            <label class="text-sm text-slate-300">Үнэ (₮)</label>
                            <input id="p-price" type="number" placeholder="1500000"
                                class="mt-1 w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 placeholder-slate-400 focus:ring-2 focus:ring-emerald-500 outline-none transition">
                        </div>
                    </div>
                    <div>
                        <label class="text-sm text-slate-300">Багц / нэмэлт үйлчилгээ (сонголттой)</label>
                        <input id="p-packages" type="text" placeholder="Gold, Silver..."
                            class="mt-1 w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 placeholder-slate-400 focus:ring-2 focus:ring-emerald-500 outline-none transition">
                    </div>
                    <div class="grid sm:grid-cols-2 gap-3">
                        <div>
                            <label class="text-sm text-slate-300">Зургийн URL (сонголттой)</label>
                            <input id="p-image" type="text" placeholder="https://..."
                                class="mt-1 w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 placeholder-slate-400 focus:ring-2 focus:ring-emerald-500 outline-none transition">
                        </div>
                        <div>
                            <label class="text-sm text-slate-300">Чөлөөт огноо (сонголттой)</label>
                            <input id="p-dates" type="text" placeholder="2025-01-05, 2025-01-12"
                                class="mt-1 w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 placeholder-slate-400 focus:ring-2 focus:ring-emerald-500 outline-none transition">
                        </div>
                    </div>
                    <div>
                        <label class="text-sm text-slate-300">Байршил</label>
                        <input id="p-location" type="text" placeholder="Central UB"
                            class="mt-1 w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 placeholder-slate-400 focus:ring-2 focus:ring-emerald-500 outline-none transition">
                    </div>
                </div>

                <button type="button" id="provider-btn"
                    class="w-full mt-2 py-3 rounded-lg bg-amber-500 hover:bg-amber-600 font-semibold transition-transform hover:scale-[1.02] active:scale-[0.98]">
                    Үйлчилгээ бүртгүүлэх
                </button>
            </div>

            <!-- DASHBOARD -->
            <div id="dashboard" class="hidden space-y-4 mt-4">
                <div class="bg-white/10 border border-white/10 rounded-lg p-4">
                    <h2 class="text-lg font-semibold text-white">Тавтай морил 👋</h2>
                    <p class="text-slate-300">
                        Хэрэглэгч:
                        <span id="user-identifier" class="text-indigo-300 font-medium"></span>
                    </p>
                </div>

                <div class="bg-white/10 border border-white/10 rounded-lg p-4">
                    <h3 class="font-medium mb-2">Нэвтрэх түүх</h3>
                    <ul id="history" class="text-sm text-slate-300 space-y-1"></ul>
                </div>

                <button type="button" id="logout-btn"
                    class="w-full py-3 rounded-lg bg-rose-500 hover:bg-rose-600 font-semibold transition">
                    Гарах
                </button>
            </div>

        </div>        
    </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
