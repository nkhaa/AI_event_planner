<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <title>Үйлчилгээ бүртгүүлэх | AI Event Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #f97316;
      --primary-dark: #ea580c;
      --secondary: #fbbf24;
      --dark: #0c1222;
      --dark-soft: #1a2332;
      --dark-lighter: #2a3442;
      --light: #f8fafc;
      --text-light: #cbd5e1;
      --text-lighter: #94a3b8;
    }

    /* Light theme colors */
    [data-theme="light"] {
      --dark: #f8fafc;
      --dark-soft: #ffffff;
      --dark-lighter: #f1f5f9;
      --light: #0f172a;
      --text-light: #334155;
      --text-lighter: #64748b;
    }

    body {
      font-family: 'Source Sans Pro', sans-serif;
      background: var(--dark);
      color: var(--light);
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Navigation */
    nav {
      background: rgba(26, 35, 50, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(249, 115, 22, 0.2);
      padding: 20px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-nav {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .nav-link {
      color: var(--text-light);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
      font-size: 15px;
    }

    .nav-link:hover {
      color: var(--primary);
    }

    .btn-logout {
      padding: 10px 24px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      color: #fca5a5;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      font-size: 14px;
    }

    .btn-logout:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.5);
    }

    /* Theme toggle */
    .theme-toggle {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(249, 115, 22, 0.2);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.3s ease;
    }

    .theme-toggle:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: var(--primary);
      transform: rotate(180deg);
    }

    /* Main content */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    .form-card {
      background: rgba(26, 35, 50, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(249, 115, 22, 0.2);
      border-radius: 24px;
      padding: 48px;
      animation: slideUp 0.8s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .form-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    .form-header p {
      color: var(--text-lighter);
      font-size: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-light);
      font-weight: 600;
      font-size: 14px;
    }

    .form-input,
    .form-textarea {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(249, 115, 22, 0.2);
      border-radius: 10px;
      color: var(--light);
      font-size: 15px;
      font-family: 'Source Sans Pro', sans-serif;
      transition: all 0.3s ease;
    }

    .form-input:focus,
    .form-textarea:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
    }

    .form-input::placeholder,
    .form-textarea::placeholder {
      color: var(--text-lighter);
    }

    .form-textarea {
      resize: vertical;
      min-height: 100px;
    }

    .info-box {
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.3);
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .info-box-title {
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 8px;
      font-size: 14px;
    }

    .info-box-text {
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.6;
    }

    .btn-submit {
      width: 100%;
      padding: 16px 32px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Source Sans Pro', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
      margin-top: 32px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(249, 115, 22, 0.5);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit.loading {
      position: relative;
      color: transparent;
      pointer-events: none;
    }

    .btn-submit.loading::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      top: 50%;
      left: 50%;
      margin: -12px 0 0 -12px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 20px;
      animation: shake 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .success-message {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .form-card {
        padding: 32px 24px;
      }

      .form-header h1 {
        font-size: 32px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .nav-links {
        gap: 12px;
      }
    }
  </style>
</head>

<body>

<nav>
  <div class="nav-container">
    <div class="logo-nav">Event Planner</div>
    <div class="nav-links">
      <a href="/dashboard" class="nav-link">Хяналтын самбар</a>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <span id="theme-icon">🌙</span>
      </button>
      <a href="#" onclick="logout(); return false;" class="btn-logout">Гарах</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="form-card">
    <div class="form-header">
      <h1>Үйлчилгээ бүртгүүлэх</h1>
      <p>Таны бизнесийг олон хүмүүст хүргэцгээе</p>
    </div>

    <div id="message-container"></div>

    <form id="providerForm" onsubmit="submitProvider(event)">
      <div class="info-box">
        <div class="info-box-title">💡 Зөвлөгөө</div>
        <div class="info-box-text">
          Бүх талбарыг үнэн зөв мэдээллээр бөглөснөөр илүү олон хэрэглэгч 
          таны үйлчилгээг олж харах боломжтой болно.
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Байгууллагын нэр *</label>
          <input 
            type="text" 
            id="name" 
            class="form-input" 
            placeholder="Жишээ: Grand Hall"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label">Байршил *</label>
          <input 
            type="text" 
            id="location" 
            class="form-input" 
            placeholder="Жишээ: Улаанбаатар, СБД"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label">Хүчин чадал (хүний тоо) *</label>
          <input 
            type="number" 
            id="capacity" 
            class="form-input" 
            placeholder="200"
            min="1"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label">Үнэ (₮) *</label>
          <input 
            type="number" 
            id="price" 
            class="form-input" 
            placeholder="5000000"
            min="0"
            required
          >
        </div>
      </div>

      <div class="form-group full-width">
        <label class="form-label">Багц үйлчилгээ *</label>
        <textarea 
          id="packages" 
          class="form-textarea" 
          placeholder="Жишээ нь: Төрсөн өдөр, Хурим, Бизнес уулзалт, VIP эвент гэх мэт..."
          required
        ></textarea>
      </div>

      <div class="form-group full-width">
        <label class="form-label">Дэлгэрэнгүй тайлбар</label>
        <textarea 
          id="description" 
          class="form-textarea" 
          placeholder="Үйлчилгээний онцлог, боломжууд, дэд бүтцийн тухай..."
        ></textarea>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Холбоо барих утас</label>
          <input 
            type="tel" 
            id="contact_phone" 
            class="form-input" 
            placeholder="99001122"
          >
        </div>

        <div class="form-group">
          <label class="form-label">И-мэйл хаяг</label>
          <input 
            type="email" 
            id="contact_email" 
            class="form-input" 
            placeholder="info@example.com"
          >
        </div>
      </div>

      <div class="form-group full-width">
        <label class="form-label">Зургийн URL</label>
        <input 
          type="url" 
          id="image_url" 
          class="form-input" 
          placeholder="https://example.com/image.jpg"
        >
      </div>

      <button type="submit" class="btn-submit">
        Бүртгүүлэх
      </button>
    </form>
  </div>
</div>

<script>
// Theme management
function initTheme() {
  const savedTheme = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon(savedTheme);
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
  updateThemeIcon(newTheme);
}

function updateThemeIcon(theme) {
  const icon = document.getElementById('theme-icon');
  if (icon) {
    icon.textContent = theme === 'dark' ? '🌙' : '☀️';
  }
}

// Initialize theme on page load
initTheme();

function showMessage(message, type = 'error') {
  const container = document.getElementById('message-container');
  const className = type === 'success' ? 'success-message' : 'error-message';
  container.innerHTML = `<div class="${className}">${message}</div>`;
  
  // Scroll to top to show message
  window.scrollTo({ top: 0, behavior: 'smooth' });
  
  // Auto-hide success messages
  if (type === 'success') {
    setTimeout(() => {
      container.innerHTML = '';
    }, 5000);
  }
}

function clearMessage() {
  document.getElementById('message-container').innerHTML = '';
}

async function submitProvider(event) {
  event.preventDefault();
  clearMessage();
  
  const btn = document.querySelector('.btn-submit');
  btn.classList.add('loading');
  
  const formData = {
    name: document.getElementById('name').value.trim(),
    location: document.getElementById('location').value.trim(),
    capacity: parseInt(document.getElementById('capacity').value),
    price: parseInt(document.getElementById('price').value),
    packages: document.getElementById('packages').value.trim(),
    description: document.getElementById('description').value.trim(),
    contact_phone: document.getElementById('contact_phone').value.trim(),
    contact_email: document.getElementById('contact_email').value.trim(),
    image_url: document.getElementById('image_url').value.trim()
  };
  
  try {
    const res = await fetch("/api/providers/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify(formData)
    });
    
    const data = await res.json();
    
    if (res.ok) {
      showMessage("✅ Амжилттай бүртгэгдлээ! Хяналтын самбар руу шилжиж байна...", 'success');
      setTimeout(() => {
        location.href = "/dashboard";
      }, 2000);
    } else {
      showMessage(data.error || "Бүртгэх явцад алдаа гарлаа");
    }
  } catch (error) {
    showMessage("Сервертэй холбогдоход алдаа гарлаа");
  } finally {
    btn.classList.remove('loading');
  }
}

async function logout() {
  try {
    await fetch('/logout', {
      method: 'POST',
      credentials: 'include'
    });
    location.href = '/';
  } catch (error) {
    console.error('Logout error:', error);
    location.href = '/';
  }
}
</script>

</body>
</html>
