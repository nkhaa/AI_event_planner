<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <title>Хяналтын самбар | AI Event Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #f97316;
      --primary-dark: #ea580c;
      --secondary: #fbbf24;
      --dark: #0c1222;
      --dark-soft: #1a2332;
      --dark-lighter: #2a3442;
      --light: #f8fafc;
      --text-light: #cbd5e1;
      --text-lighter: #94a3b8;
    }

    /* Light theme colors */
    [data-theme="light"] {
      --dark: #f8fafc;
      --dark-soft: #ffffff;
      --dark-lighter: #f1f5f9;
      --light: #0f172a;
      --text-light: #334155;
      --text-lighter: #64748b;
    }

    body {
      font-family: 'Source Sans Pro', sans-serif;
      background: var(--dark);
      color: var(--light);
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Navigation */
    nav {
      background: rgba(26, 35, 50, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(249, 115, 22, 0.2);
      padding: 20px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-nav {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .nav-link {
      color: var(--text-light);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
      font-size: 15px;
    }

    .nav-link:hover {
      color: var(--primary);
    }

    .btn-logout {
      padding: 10px 24px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      color: #fca5a5;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      font-size: 14px;
    }

    .btn-logout:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.5);
    }

    /* Theme toggle */
    .theme-toggle {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(249, 115, 22, 0.2);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.3s ease;
    }

    .theme-toggle:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: var(--primary);
      transform: rotate(180deg);
    }

    /* Main content */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    .header {
      margin-bottom: 40px;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--text-lighter);
      font-size: 16px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: rgba(26, 35, 50, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(249, 115, 22, 0.2);
      border-radius: 20px;
      padding: 32px;
      transition: all 0.3s ease;
      animation: slideUp 0.8s ease;
      animation-fill-mode: both;
    }

    .stat-card:nth-child(1) { animation-delay: 0.1s; }
    .stat-card:nth-child(2) { animation-delay: 0.2s; }
    .stat-card:nth-child(3) { animation-delay: 0.3s; }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .stat-card:hover {
      transform: translateY(-8px);
      border-color: rgba(249, 115, 22, 0.4);
      box-shadow: 0 12px 32px rgba(249, 115, 22, 0.2);
    }

    .stat-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
    }

    .stat-label {
      color: var(--text-lighter);
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      font-weight: 900;
      color: var(--light);
      line-height: 1;
    }

    .action-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .action-btn {
      background: rgba(26, 35, 50, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(249, 115, 22, 0.2);
      border-radius: 16px;
      padding: 24px;
      text-decoration: none;
      color: var(--light);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 16px;
      animation: slideUp 0.8s ease;
      animation-delay: 0.4s;
      animation-fill-mode: both;
    }

    .action-btn:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: 0 8px 24px rgba(249, 115, 22, 0.2);
    }

    .action-btn-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .action-btn-content h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .action-btn-content p {
      font-size: 14px;
      color: var(--text-lighter);
    }

    .section {
      background: rgba(26, 35, 50, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(249, 115, 22, 0.2);
      border-radius: 20px;
      padding: 32px;
      margin-bottom: 32px;
      animation: slideUp 0.8s ease;
      animation-delay: 0.5s;
      animation-fill-mode: both;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--light);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .info-item {
      background: rgba(255, 255, 255, 0.03);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(249, 115, 22, 0.1);
    }

    .info-item-label {
      font-size: 13px;
      color: var(--text-lighter);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .info-item-value {
      font-size: 16px;
      color: var(--light);
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(249, 115, 22, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 32px;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .action-buttons {
        grid-template-columns: 1fr;
      }

      .nav-links {
        gap: 12px;
      }
    }
  </style>
</head>

<body>

<nav>
  <div class="nav-container">
    <div class="logo-nav">Event Planner</div>
    <div class="nav-links" id="nav-links">
      <!-- Will be populated by JS -->
    </div>
  </div>
</nav>

<div class="container">
  <div class="header">
    <h1>Хяналтын самбар</h1>
    <p id="welcome-message">Тавтай морилно уу</p>
  </div>

  <div id="dashboard-content">
    <div class="loading">
      <div class="spinner"></div>
      <p>Уншиж байна...</p>
    </div>
  </div>
</div>

<script>
// Theme management
function initTheme() {
  const savedTheme = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon(savedTheme);
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
  updateThemeIcon(newTheme);
}

function updateThemeIcon(theme) {
  const icon = document.getElementById('theme-icon');
  if (icon) {
    icon.textContent = theme === 'dark' ? '🌙' : '☀️';
  }
}

// Initialize theme on page load
initTheme();

let currentUser = null;

async function loadDashboard() {
  try {
    // Get current user
    const userRes = await fetch('/api/current-user', {
      credentials: 'include'
    });
    
    if (!userRes.ok) {
      location.href = '/';
      return;
    }
    
    currentUser = await userRes.json();
    
    // Update welcome message
    document.getElementById('welcome-message').textContent = 
      `Тавтай морилно уу, ${currentUser.identifier}`;
    
    // Update navigation
    updateNavigation();
    
    // Load stats
    const statsRes = await fetch('/api/stats', {
      credentials: 'include'
    });
    
    const stats = await statsRes.json();
    
    // Render dashboard based on user type
    if (stats.user_type === 'provider') {
      renderProviderDashboard(stats);
    } else {
      renderUserDashboard(stats);
    }
    
  } catch (error) {
    console.error('Dashboard error:', error);
    document.getElementById('dashboard-content').innerHTML = `
      <div class="section">
        <p style="text-align: center; color: var(--text-lighter);">
          Алдаа гарлаа. Дахин оролдоно уу.
        </p>
      </div>
    `;
  }
}

function updateNavigation() {
  const navLinks = document.getElementById('nav-links');
  
  if (currentUser.user_type === 'provider') {
    navLinks.innerHTML = `
      <a href="/provider-register" class="nav-link">Үйлчилгээ нэмэх</a>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <span id="theme-icon">🌙</span>
      </button>
      <a href="#" onclick="logout(); return false;" class="btn-logout">Гарах</a>
    `;
  } else {
    navLinks.innerHTML = `
      <a href="/search" class="nav-link">Хайлт хийх</a>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <span id="theme-icon">🌙</span>
      </button>
      <a href="#" onclick="logout(); return false;" class="btn-logout">Гарах</a>
    `;
  }
  
  // Update theme icon after navigation is rendered
  const savedTheme = localStorage.getItem('theme') || 'dark';
  updateThemeIcon(savedTheme);
}

function renderProviderDashboard(stats) {
  document.getElementById('dashboard-content').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">🏢</div>
        <div class="stat-label">Нийт үйлчилгээ</div>
        <div class="stat-value">${stats.total_providers || 0}</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon">📅</div>
        <div class="stat-label">Нийт захиалга</div>
        <div class="stat-value">${stats.total_bookings || 0}</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon">⭐</div>
        <div class="stat-label">Дундаж үнэлгээ</div>
        <div class="stat-value">${stats.average_rating || '0.0'}</div>
      </div>
    </div>

    <div class="action-buttons">
      <a href="/provider-register" class="action-btn">
        <div class="action-btn-icon">➕</div>
        <div class="action-btn-content">
          <h3>Үйлчилгээ нэмэх</h3>
          <p>Шинэ үйлчилгээ бүртгүүлэх</p>
        </div>
      </a>
      
      <a href="#" onclick="viewMyProviders(); return false;" class="action-btn">
        <div class="action-btn-icon">📋</div>
        <div class="action-btn-content">
          <h3>Миний үйлчилгээнүүд</h3>
          <p>Бүртгэлтэй үйлчилгээг харах</p>
        </div>
      </a>
    </div>

    <div class="section">
      <div class="section-title">Танилцуулга</div>
      <p style="color: var(--text-light); line-height: 1.8;">
        Та үйлчилгээ үзүүлэгчийн эрхтэй байна. Өөрийн үйлчилгээг бүртгэж, 
        хэрэглэгчдэд санал болгоорой. Үйлчилгээ бүрийг нэмэхдээ бүх мэдээллийг 
        үнэн зөв оруулснаар илүү олон хэрэглэгч таны үйлчилгээг олж харах 
        боломжтой болно.
      </p>
    </div>
  `;
}

function renderUserDashboard(stats) {
  document.getElementById('dashboard-content').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">📅</div>
        <div class="stat-label">Миний захиалга</div>
        <div class="stat-value">${stats.total_bookings || 0}</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon">🏢</div>
        <div class="stat-label">Боломжит газар</div>
        <div class="stat-value">${stats.total_providers || 0}</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon">✨</div>
        <div class="stat-label">AI санал</div>
        <div class="stat-value">Удахгүй</div>
      </div>
    </div>

    <div class="action-buttons">
      <a href="/search" class="action-btn">
        <div class="action-btn-icon">🔍</div>
        <div class="action-btn-content">
          <h3>Хайлт хийх</h3>
          <p>Тохирсон газраа олоорой</p>
        </div>
      </a>
      
      <a href="#" class="action-btn" onclick="alert('Удахгүй нэмэгдэнэ'); return false;">
        <div class="action-btn-icon">📋</div>
        <div class="action-btn-content">
          <h3>Миний захиалгууд</h3>
          <p>Захиалгын түүхээ харах</p>
        </div>
      </a>
    </div>

    <div class="section">
      <div class="section-title">Танилцуулга</div>
      <p style="color: var(--text-light); line-height: 1.8;">
        Тавтай морилно уу! Энэхүү платформ нь таны тэмдэглэлт өдрийг 
        төлөвлөхөд туслах зорилготой. Байршил, үнэ, хүчин чадлын дагуу 
        хайлт хийж, өөрт тохирсон үйлчилгээгээ олоорой. Хиймэл оюун таны 
        сонирхол, хэрэгцээнд тулгуурлан хамгийн тохиромжтой сонголтуудыг 
        санал болгох болно.
      </p>
    </div>
  `;
}

async function viewMyProviders() {
  alert('Миний үйлчилгээнүүд хуудас удахгүй нэмэгдэнэ');
}

async function logout() {
  try {
    await fetch('/logout', {
      method: 'POST',
      credentials: 'include'
    });
    location.href = '/';
  } catch (error) {
    console.error('Logout error:', error);
    location.href = '/';
  }
}

// Load dashboard on page load
window.addEventListener('load', loadDashboard);
</script>

</body>
</html>
